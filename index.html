  <style>
    :root {
      --paper: #fff;
      --ink: #000;
      --mute: rgba(0, 0, 0, .55);
      --rule: rgba(0, 0, 0, .18);
      --mark: 48px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
 
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--paper);
      color: var(--ink);
      font-family: "Baskervville", Baskerville, "Libre Baskerville", "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern", "liga";
      text-rendering: optimizeLegibility;
    }
 
    a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); transition: border-color .25s; }
    a:hover { border-bottom-color: var(--ink); }
    a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; border-bottom-color: transparent; }
 
    /* ---------- brand ---------- */
    .brand {
      padding: 44px 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
      transition: transform 1.1s var(--ease);
    }
    .brand .mark { border: 0; display: block; width: var(--mark); height: var(--mark); color: var(--ink); }
    .brand .mark svg { display: block; width: 100%; height: 100%; }
    .brand .wordmark {
      font-size: 11.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      padding-left: .26em; /* balance the trailing tracking */
      white-space: nowrap;
    }
 
    /* ---------- page ---------- */
    main {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      text-align: center;
    }
    .hero { max-width: 36em; }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(36px, 5.2vw, 56px);
      line-height: 1.08;
      letter-spacing: -.005em;
      text-wrap: balance;
    }
    .rule { width: 28px; height: 1px; background: var(--ink); opacity: .35; margin: 30px auto 28px; }
    .lede { margin: 0 auto; max-width: 30em; font-size: clamp(17px, 1.45vw, 20px); line-height: 1.5; text-wrap: balance; }
    .lede p { margin: 0; }
    .lede p + p { margin-top: .35em; }
 
    footer {
      padding: 0 24px 36px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 44px;
      font-size: 12.5px;
      letter-spacing: .02em;
      color: var(--mute);
      text-align: center;
    }
    footer a { color: var(--ink); }
    footer span { white-space: nowrap; }
 
    /* ---------- gate ---------- */
    .gate {
      position: fixed;
      left: 0; right: 0;
      top: calc(50vh + 36px);
      top: calc(50svh + 36px);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 24px;
      transition: opacity .5s ease, visibility .5s;
    }
    .gate input {
      font: inherit;
      font-size: 18px;
      text-align: center;
      width: min(240px, 80vw);
      padding: 8px 0;
      border: 0;
      border-bottom: 1px solid rgba(0, 0, 0, .3);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color .3s;
    }
    .gate input:focus { border-bottom-color: var(--ink); }
    .gate input::placeholder { color: rgba(0, 0, 0, .35); }
    .gate button {
      font: inherit;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: 16px 8px 8px;
      border: 0;
      background: none;
      color: var(--mute);
      cursor: pointer;
      transition: color .25s;
    }
    .gate button:hover, .gate button:focus-visible { color: var(--ink); outline: none; }
    .gate .err {
      font-size: 13px;
      font-style: italic;
      color: var(--mute);
      min-height: 1.4em;
      opacity: 0;
      transition: opacity .3s;
    }
    .gate .err.show { opacity: 1; }
 
    /* ---------- states ---------- */
    /* locked (default): brand centred, content hidden */
    html:not(.unlocked) body { overflow: hidden; height: 100vh; height: 100svh; }
    html:not(.unlocked) .brand { transform: translateY(calc(50vh - 44px - 38px - 60px)); transform: translateY(calc(50svh - 44px - 38px - 60px)); }
    main, footer { opacity: 0; transform: translateY(10px); transition: opacity .9s ease .55s, transform 1.1s var(--ease) .55s; }
 
    /* unlocked: brand rises to the top, page fades in, gate fades away */
    html.unlocked .brand { transform: none; }
    html.unlocked main, html.unlocked footer { opacity: 1; transform: none; }
    html.unlocked .gate { opacity: 0; visibility: hidden; pointer-events: none; }
    html.settled .brand, html.settled main, html.settled footer { transition: none; }
 
    @media (prefers-reduced-motion: reduce) {
      .brand, main, footer, .gate { transition: none !important; }
    }
 
    @media (max-width: 640px) {
      :root { --mark: 44px; }
      .brand { padding-top: 32px; gap: 14px; }
      html:not(.unlocked) .brand { transform: translateY(calc(50vh - 32px - 36px - 60px)); transform: translateY(calc(50svh - 32px - 36px - 60px)); }
      main { padding: 40px 24px; }
      .rule { margin: 24px auto 22px; }
      footer { flex-direction: column; gap: 10px; padding-bottom: 28px; font-size: 13px; }

  <script>
    // The password is not stored here — only a salted SHA-256 of it.
    // To change it: open the browser console on this page and run  hash("new password")
    // then paste the result into HASH below.
    const SALT = "transcend-ai/gamma-i:";
    const HASH = "583c405031076700a3d07851d3c3918212a4edd3d33168b7331787274f734e5d";
    const KEY  = "gate_unlocked_v3";
 
    const root = document.documentElement;
    const gate = document.getElementById("gate");
    const pw   = document.getElementById("pw");
    const err  = document.getElementById("err");
 
    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
    }
    window.hash = p => sha256(SALT + (p || "").trim().toLowerCase());
 
    function unlock() {
      root.classList.add("unlocked");
      // once the brand has settled at the top, drop the transitions so resizes don't animate
      setTimeout(() => root.classList.add("settled"), 1300);
    }
 
    async function check() {
      const val = (pw.value || "").trim().toLowerCase();
      if (!val) { pw.focus(); return; }
      if (!window.crypto || !crypto.subtle) {
        err.textContent = "Please open this page over https."; err.classList.add("show"); return;
      }
      if (await sha256(SALT + val) === HASH) {
        try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
        err.classList.remove("show");
        pw.blur();
        unlock();
      } else {
        err.textContent = "Incorrect password."; err.classList.add("show");
        pw.focus(); pw.select();
      }
    }
 
    gate.addEventListener("submit", e => { e.preventDefault(); check(); });
    pw.addEventListener("input", () => err.classList.remove("show"));
    if (!root.classList.contains("unlocked")) window.addEventListener("load", () => pw.focus());
  </script>
